name: Title Capitalizr
options:
  bundleIdPrefix: com.johnseong
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: Z64KRUX3W3
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.6"
    CURRENT_PROJECT_VERSION: 2
targets:
  Title Capitalizr:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Title Capitalizr
        excludes: ["Title Capitalizr.entitlements", "Info.plist"]
    info:
      path: Title Capitalizr/Info.plist
      properties:
        CFBundleDisplayName: Title Capitalizr
        CFBundleName: Title Capitalizr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: Copyright © 2026 John Seong. All rights reserved.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnseong.titlecapitalizr
        PRODUCT_NAME: Title Capitalizr
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: '"Title Capitalizr/Preview Content"'
        ENABLE_PREVIEWS: true
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Title Capitalizr/Title Capitalizr.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": true
        OTHER_LDFLAGS: "-weak_framework FoundationModels"
        SWIFT_EMIT_LOC_STRINGS: true
  Title CapitalizrTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Title CapitalizrTests]
    dependencies:
      - target: Title Capitalizr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnseong.titlecapitalizr.tests
        GENERATE_INFOPLIST_FILE: true
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Title Capitalizr.app/Contents/MacOS/Title Capitalizr"
schemes:
  Title Capitalizr:
    build:
      targets:
        Title Capitalizr: all
        Title CapitalizrTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [Title CapitalizrTests]
    archive:
      config: Release
